name: Dependency and application checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked runtime and validation tools
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Audit all locked runtime dependencies
        run: python scripts/audit_dependencies.py
      - name: Test API and real CPU model round trips
        run: |
          python -m pytest -q
          node --check app/static/client.js
          git diff --check
      - name: Build container without downloading or executing a model
        run: docker build -t waste-classifier:test .
      - name: Check container startup with missing model
        run: |
          docker run -d --name classifier -p 5000:5000 waste-classifier:test
          trap 'docker logs classifier; docker rm -f classifier' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:5000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:5000/ > /dev/null
          status=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' http://localhost:5000/health)
          test "$status" = 503
          python -c 'import json; assert json.load(open("/tmp/health.json")) == {"status": "model_unavailable"}'
